name: findit
description: 'FindIt - Search Hidden Objects: colorful offline search adventures.'
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: 3.4.3
  go_router: 18.1.2
  drift: 2.35.3
  sqlite3: 3.8.0
  path_provider: 2.1.6
  path: 1.9.1
  shared_preferences: 2.5.6
  audioplayers: 6.8.1
  http: 1.6.0
  crypto: 3.0.8
  url_launcher: 6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: 2.35.2
  build_runner: 2.17.1
  flutter_launcher_icons: 0.14.4
  flutter_native_splash: 2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/content/
    - assets/scenes/
    - assets/branding/
    - assets/audio/
    - assets/legal/
  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit.ttf
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito.ttf

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/branding/app_icon.png
  adaptive_icon_background: '#FBF7EE'
  adaptive_icon_foreground: assets/branding/icon_foreground.png
  adaptive_icon_foreground_inset: 0
  adaptive_icon_monochrome: assets/branding/icon_monochrome.png
  min_sdk_android: 24
  web:
    generate: true
    image_path: assets/branding/app_icon.png
    background_color: '#FBF7EE'
    theme_color: '#237A68'

flutter_native_splash:
  color: '#FBF7EE'
  image: assets/branding/splash_mark.png
  android: true
  ios: false
  web: true
  android_12:
    color: '#FBF7EE'
    image: assets/branding/splash_mark.png
    icon_background_color: '#FBF7EE'
